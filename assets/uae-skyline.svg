<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skylineGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A869" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#DFC995" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F4E8C8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#DFC995" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C5A869" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="skylineFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E1E34" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#162D4D" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Ground subtle baseline -->
  <line x1="0" y1="118" x2="1200" y2="118" stroke="url(#skylineGold)" stroke-width="1.5" opacity="0.6"/>

