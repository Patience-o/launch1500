           <!-- Ain Dubai Wheel -->
           L 420 118 L 435 85 A 25 25 0 0 1 485 85 L 500 118 L 475 118 L 460 70 L 445 118
           <!-- Tower clusters -->
           L 520 118 L 520 75 L 540 75 L 540 60 L 555 60 L 555 118
           <!-- Burj Khalifa (Spire) -->
           L 580 118 L 580 85 L 588 85 L 588 65 L 594 65 L 594 45 L 598 45 L 598 25 L 600 5 L 602 25 L 602 45 L 606 45 L 606 65 L 612 65 L 612 85 L 620 85 L 620 118
           <!-- Tower cluster 2 -->
           L 640 118 L 640 55 L 655 45 L 670 55 L 670 118
           L 690 118 L 690 70 L 710 70 L 710 118
           <!-- Emirates Towers -->
           L 730 118 L 730 40 L 750 20 L 750 118 L 760 118 L 760 50 L 778 32 L 778 118
           <!-- Midrise blocks -->
           L 800 118 L 800 85 L 825 85 L 825 118
           <!-- Grand Mosque Domes & Minarets -->
