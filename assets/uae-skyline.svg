           L 925 118 L 925 80 A 30 24 0 0 1 985 80 L 985 118 <!-- Main Grand Dome -->
           L 995 118 L 995 85 A 22 18 0 0 1 1039 85 L 1039 118 <!-- Dome 2 -->
           L 1050 118 L 1050 35 L 1054 25 L 1058 35 L 1058 118 <!-- Minaret 2 -->
           <!-- End towers -->
           L 1080 118 L 1080 75 L 1105 75 L 1105 118
           L 1130 118 L 1130 90 L 1160 90 L 1160 100 L 1200 100 L 1200 118 Z"
        fill="url(#skylineFill)" stroke="url(#skylineGold)" stroke-width="1.2" opacity="0.85"/>

  <!-- Light glowing dots/stars on peaks -->
  <circle cx="600" cy="5" r="2.5" fill="#FFE29A"/>
  <circle cx="297" cy="15" r="2" fill="#FFE29A"/>
  <circle cx="750" cy="20" r="1.8" fill="#FFE29A"/>
