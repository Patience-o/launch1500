<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EED59B"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FDF2D0"/>
      <stop offset="75%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9E7818"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#143628"/>
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Fine Ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Polished Architectural Ring -->
  <circle cx="32" cy="32" r="27.5" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Emerald Jewel Base -->
  <circle cx="32" cy="32" r="24" fill="url(#emeraldGrad)"/>

  <!-- Compass / Radiance Star -->
  <path d="M32 10 L34.8 24.5 L46 18 L39.5 29.2 L54 32 L39.5 34.8 L46 46 L34.8 39.5 L32 54 L29.2 39.5 L18 46 L24.5 34.8 L10 32 L24.5 29.2 L18 18 L29.2 24.5 Z" 
        fill="url(#goldGrad)" opacity="0.25"/>

  <!-- Faceted Primary Diamond Star -->
  <path d="M32 12 L35.5 28.5 L52 32 L35.5 35.5 L32 52 L28.5 35.5 L12 32 L28.5 28.5 Z" 
        fill="url(#goldGrad)" filter="url(#luxuryGlow)"/>

  <!-- Subtle Diamond Bevel Highlights -->
  <path d="M32 12 L35.5 28.5 L32 32 Z" fill="#FFF9E6" opacity="0.6"/>
  <path d="M52 32 L35.5 35.5 L32 32 Z" fill="#FFF9E6" opacity="0.4"/>
  <path d="M32 52 L28.5 35.5 L32 32 Z" fill="#DFB748" opacity="0.7"/>
  <path d="M12 32 L28.5 28.5 L32 32 Z" fill="#E6C86E" opacity="0.5"/>

  <!-- Center Brilliant Core -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="2.5" fill="#C59B27"/>

  <!-- Luxury Corner Sparkles -->
  <circle cx="32" cy="7" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="32" cy="57" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="7" cy="32" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="57" cy="32" r="1.5" fill="url(#goldGrad)"/>
</svg>
